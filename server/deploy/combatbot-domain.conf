map $http_upgrade $combatbot_domain_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=combatbot_connect:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name combatbot.luo-jin-ai.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name combatbot.luo-jin-ai.com;
    ssl_certificate /etc/letsencrypt/live/combatbot.luo-jin-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/combatbot.luo-jin-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 4k;

    location = /api/connect {
        limit_req zone=combatbot_connect burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $combatbot_domain_upgrade;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
