# 以下 map 放在 nginx.conf 的 http 块；替换域名与已签发的证书路径。
map $http_upgrade $combatbot_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name robot.example.com;
    ssl_certificate     /etc/letsencrypt/live/robot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robot.example.com/privkey.pem;
    client_max_body_size 4k;

    location = /combatbot {
        return 308 /combatbot/;
    }
    location /combatbot/ {
        # 不加尾部斜杠：保留 /combatbot 前缀，与 COMBATBOT_BASE_PATH 一致。
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $combatbot_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
