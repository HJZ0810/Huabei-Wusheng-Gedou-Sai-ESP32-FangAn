; =========================================================================
; ESP32-S3 四驱格斗车 · PlatformIO 工程配置
; -------------------------------------------------------------------------
; 构建：pio run -t upload        串口监视：pio device monitor
; 说明：源文件全部平铺在根目录（与 .ino 同级），这样 Arduino IDE 与
;       PlatformIO 都能直接编译，无需任何目录适配。
; =========================================================================
[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8（16MB Flash + 8MB PSRAM）推荐配置；若你的板子是 N8R8 把 flash_size 改 8MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ASYNC_TCP_MAX_WS_CLIENTS=4
    -Wall
    -O2

monitor_speed = 115200
upload_speed  = 921600

; 依赖全部来自 PlatformIO Registry
; 当前环境 = espressif32 6.9.0 / Arduino core 2.0.17 → 用 me-no-dev 原版异步服务器
lib_deps =
    me-no-dev/ESPAsyncWebServer @ ^1.2.4
    me-no-dev/AsyncTCP @ ^1.1.4
    bblanchon/ArduinoJson @ ^7.4.1
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit ADXL345 @ ^1.3.2
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
; 若把 platform 升级到 Arduino core 3.x（如 espressif32 @ ^2025.x），
; 把上面前两行替换为（core3 的 LEDC 接口在 motor.cpp 里已有兼容宏自动切换）：
;    mathieucarbou/ESPAsyncWebServer @ ^3.7.0
;    mathieucarbou/AsyncTCP @ ^3.3.0

; .ino 入口与 .cpp 模块同处根目录，Arduino IDE 与 PlatformIO 均可直接编译
src_dir = .
build_src_filter = +<*.ino> +<*.cpp>
